name: CICD

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: rocker/r-ver:4.4.1   

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            libuv1-dev \
            libxml2-dev \
            libssl-dev \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libwebp-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libudunits2-dev \
            pandoc \
            pkg-config
      
      - name: Install Package Dependencies
        run: |
          Rscript -e "install.packages(c('remotes', 'rcmdcheck', 'covr', 'pkgdown', 'bslib', 'fs', 'ragg', 'rmarkdown'), repos = 'https://cloud.r-project.org')"
          Rscript -e "remotes::install_deps(dependencies = TRUE)"

      - name: Check Package
        run: Rscript -e "rcmdcheck::rcmdcheck(error_on = 'error', check_dir = 'check', args = '--as-cran')"

      - name: Run Code Coverage
        run: Rscript -e "covr::codecov(quiet = FALSE, token = '${{ secrets.CODECOV_TOKEN }}')"

      - name: Build pkgdown site
        run: Rscript -e "pkgdown::build_site()"

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
